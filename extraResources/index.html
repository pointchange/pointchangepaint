<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>局域网分享</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .image_container {
            height: 600px;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .btns {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }

        a {
            padding: 1rem;
            font-size: 1.4rem;
            text-decoration: none;
            border: 1px solid #eee;
            color: #000
        }

        a:active {
            border-color: yellowgreen;
        }
    </style>
</head>

<body>
    <div class="image_container">
        <img src="./images/1.png">
        <div class="btns">
            <a href="javascript:;" onclick="location.reload()">刷新</a>
            <a href="./images/1.png" download="1.png">下载</a>
        </div>
    </div>
</body>

</html>
